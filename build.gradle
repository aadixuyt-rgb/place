plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

loom {
    mixin {
        // unique name so it never collides with heartindicator-refmap.json from the bundled jar
        defaultRefmapName = 'playerplace-refmap.json'
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

// Our remapped classes (PlayerPlace) are written under a classifier...
remapJar { archiveClassifier = 'unmerged' }

// ...and merged with the prebuilt Heart Indicator jar into the final single mod.
// fabric.mod.json comes from this repo (declares both mixin configs).
tasks.register('mergedJar', Jar) {
    dependsOn remapJar
    group = 'build'
    description = 'Final mod jar: Heart Indicator + always-on PlayerPlace'
    archiveClassifier = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Fabric-Mapping-Namespace': 'intermediary' }
    from({ zipTree(remapJar.archiveFile.get().asFile) }) { exclude 'META-INF/MANIFEST.MF' }
    from(zipTree(file('libs/heartindicator-2.2.0.jar'))) {
        exclude 'fabric.mod.json', 'META-INF/MANIFEST.MF'
    }
}

assemble.dependsOn mergedJar
